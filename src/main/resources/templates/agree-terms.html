<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이용약관 동의 | [[${companyName}]]</title>
    <link rel="stylesheet" th:href="@{/css/agree-terms.css}" />
</head>
<body>
<div id="wrap">
    <div class="container">
        <h2 class="title">이용약관 동의</h2>
        <p class="desc">서비스 이용을 위해 이용약관에 동의해주세요.</p>

        <div class="term-item">
            <div class="term-header">
                <input type="checkbox" id="agreeTerms" />
                <label for="agreeTerms"><strong>[필수]</strong> 이용약관에 동의합니다.</label>
            </div>
            <div class="term-content">
        <textarea readonly>
제1조(목적)
이 약관은 [[${companyName}]](이하 "회사")가 제공하는 인터넷 기반의 모든 서비스(이하 "서비스")의 이용조건 및 절차, 회사와 회원 간의 권리·의무 및 책임사항을 규정함을 목적으로 합니다.

제2조(정의)
① "회원"이라 함은 본 약관에 동의하고 회사와 이용계약을 체결하여 서비스를 이용하는 자를 말합니다.
② "아이디(ID)"란 회원 식별과 서비스 이용을 위해 회원이 정하고 회사가 승인한 문자와 숫자의 조합을 말합니다.
③ "비밀번호"란 회원이 부여받은 아이디와 일치하는지를 확인하고, 회원의 권익을 보호하기 위해 회원이 설정한 문자·숫자 조합을 의미합니다.

제3조(약관의 효력 및 변경)
① 본 약관은 회원이 가입 시 동의함으로써 효력이 발생합니다.
② 회사는 관련 법령을 위반하지 않는 범위에서 본 약관을 개정할 수 있습니다.
③ 변경된 약관은 서비스 화면을 통해 공지되며, 회원은 거부할 수 있습니다. 단, 공지 후에도 서비스를 이용하면 변경에 동의한 것으로 봅니다.

제4조(이용계약의 체결)
① 이용계약은 회원이 약관에 동의하고 가입신청을 하며, 회사가 이를 승낙함으로써 성립합니다.
② 회사는 다음 각 호에 해당하는 경우 신청을 거부할 수 있습니다.
  1. 타인의 명의로 신청한 경우
  2. 허위의 정보를 기재한 경우
  3. 사회의 안녕질서 또는 미풍양속을 저해할 우려가 있는 경우

제5조(서비스의 제공 및 변경)
① 회사는 회원에게 게시물 작성, 댓글, 좋아요, 팔로우 등 커뮤니티 기능을 제공합니다.
② 회사는 필요한 경우 서비스의 내용을 추가, 변경, 종료할 수 있으며 그 사유와 내용을 사전 공지합니다.

제6조(회원의 의무)
① 회원은 본 약관 및 관련 법령을 준수해야 합니다.
② 회원은 타인의 권리를 침해하거나 공공질서 및 미풍양속에 반하는 행위를 해서는 안 됩니다.
③ 회원은 자신의 계정 정보를 제3자에게 양도하거나 공유할 수 없습니다.

제7조(회사의 의무)
① 회사는 관련 법령과 본 약관이 금지하지 않는 한 회원에게 지속적이고 안정적인 서비스를 제공합니다.
② 회사는 회원의 개인정보를 보호하기 위해 개인정보처리방침을 제정·운영합니다.

제8조(게시물의 저작권 및 관리)
① 회원이 서비스 내에 게시한 게시물의 저작권은 회원에게 있습니다.
② 회사는 서비스 운영 및 홍보를 위해 비상업적 목적으로 게시물을 이용할 수 있습니다.
③ 법령 또는 이용약관에 위반되는 게시물은 사전 통보 없이 삭제될 수 있습니다.

제9조(서비스 이용의 제한 및 해지)
① 회원이 본 약관을 위반할 경우 회사는 서비스 이용을 제한하거나 회원자격을 해지할 수 있습니다.
② 회원이 탈퇴를 요청할 경우 회사는 즉시 회원 탈퇴를 처리합니다.

제10조(면책조항)
① 회사는 천재지변, 시스템 오류, 통신 장애 등 불가항력으로 인한 서비스 중단에 대해 책임을 지지 않습니다.
② 회사는 회원의 귀책 사유로 인한 손해에 대해 책임을 지지 않습니다.

제11조(준거법 및 관할)
이 약관은 대한민국 법률에 따라 해석되며, 분쟁 발생 시 회사의 본사 소재지를 관할하는 법원을 제1심 관할 법원으로 합니다.
        </textarea>
            </div>
        </div>

        <button id="nextBtn" class="next-btn" disabled>다음</button>
    </div>
</div>

<script>
    const agreeTerms = document.getElementById("agreeTerms");
    const nextBtn = document.getElementById("nextBtn");

    agreeTerms.addEventListener("change", () => {
        nextBtn.disabled = !agreeTerms.checked;
        nextBtn.classList.toggle("active", agreeTerms.checked);
    });

    nextBtn.addEventListener("click", () => {
        if (agreeTerms.checked) {
            window.location.href = "/agree/privacy";
        }
    });
</script>
</body>
</html>
