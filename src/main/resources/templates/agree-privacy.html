<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>개인정보처리방침 동의 | [[${companyName}]]</title>
    <link rel="stylesheet" th:href="@{/css/agree-terms.css}" />
</head>
<body>
<div id="wrap">
    <div class="container">
        <h2 class="title">개인정보처리방침 동의</h2>
        <p class="desc">서비스 이용을 위해 개인정보처리방침에 동의해주세요.</p>

        <div class="term-item">
            <div class="term-header">
                <input type="checkbox" id="agreePrivacy" />
                <label for="agreePrivacy"><strong>[필수]</strong> 개인정보처리방침에 동의합니다.</label>
            </div>
            <div class="term-content">
        <textarea readonly>
[[${companyName}]](이하 "회사")는 「개인정보 보호법」 등 관련 법령을 준수하며, 이용자의 개인정보를 보호하기 위해 다음과 같은 방침을 수립·운영합니다.

제1조(수집하는 개인정보의 항목)
회사는 회원가입 및 서비스 이용 시 다음의 개인정보를 수집할 수 있습니다.
① 필수항목: 이메일, 비밀번호, 닉네임
② 선택항목: 프로필 이미지
③ 자동수집항목: 접속 IP, 브라우저 정보, 이용기록, 쿠키 등

제2조(개인정보의 수집 및 이용 목적)
회사는 수집한 개인정보를 다음의 목적으로 이용합니다.
① 회원가입 및 본인 확인
② 서비스 제공 및 고객 상담
③ 이용 통계 및 서비스 개선
④ 공지사항 전달 및 마케팅 활용(동의한 경우에 한함)

제3조(개인정보의 보유 및 이용기간)
① 회원 탈퇴 시 지체 없이 개인정보를 파기합니다.
② 단, 관련 법령에 따라 다음의 정보는 일정 기간 보관할 수 있습니다.
  - 전자상거래 관련 기록: 5년
  - 소비자 불만 및 분쟁처리 기록: 3년
  - 로그기록: 3개월

제4조(개인정보의 제3자 제공)
① 회사는 원칙적으로 이용자의 개인정보를 외부에 제공하지 않습니다.
② 단, 다음의 경우에는 예외로 합니다.
  1. 법령에 따라 수사기관이 요청하는 경우
  2. 이용자가 사전에 동의한 경우

제5조(개인정보의 처리위탁)
회사는 원활한 서비스 제공을 위해 일부 업무를 외부 전문업체에 위탁할 수 있습니다.
위탁 시 개인정보보호법에 따라 안전하게 관리되도록 감독합니다.

제6조(개인정보의 파기절차 및 방법)
① 회사는 개인정보의 보유기간이 경과하거나 처리 목적이 달성된 경우 지체 없이 파기합니다.
② 파기방법은 전자적 파일은 복구 불가능한 방법으로 삭제하며, 종이 문서는 분쇄 또는 소각합니다.

제7조(이용자 및 법정대리인의 권리)
① 이용자는 언제든지 자신의 개인정보를 열람, 정정, 삭제, 처리정지를 요구할 수 있습니다.
② 회원 탈퇴 시 회사는 즉시 관련 개인정보를 삭제합니다.

제8조(개인정보의 안전성 확보 조치)
회사는 개인정보의 안정성을 확보하기 위하여 다음과 같은 조치를 취하고 있습니다.
① 비밀번호 등 중요정보 암호화
② 접근권한 관리 및 접근통제 시스템 운영
③ 보안 프로그램 설치 및 주기적 점검
④ 물리적 접근 통제

제9조(개인정보 보호책임자)
회사는 개인정보 보호와 관련된 문의 처리를 위해 다음과 같은 개인정보 보호책임자를 지정합니다.

- 성명: 개인정보 보호책임자
- 이메일: privacy@[[${companyName}]].kr
- 연락처: 000-0000-0000

제10조(개인정보처리방침의 변경)
본 개인정보처리방침은 법령 변경이나 서비스 정책 변경에 따라 개정될 수 있으며, 변경 시 회사는 홈페이지를 통해 공지합니다.

[시행일] 2025년 11월 3일
        </textarea>
            </div>
        </div>

        <button id="nextBtn" class="next-btn" disabled>회원가입으로 이동</button>
    </div>
</div>

<script>
    const agreePrivacy = document.getElementById("agreePrivacy");
    const nextBtn = document.getElementById("nextBtn");

    agreePrivacy.addEventListener("change", () => {
        nextBtn.disabled = !agreePrivacy.checked;
        nextBtn.classList.toggle("active", agreePrivacy.checked);
    });

    nextBtn.addEventListener("click", () => {
        if (agreePrivacy.checked) {
            window.location.href = "http://localhost:3000/signup";
        }
    });
</script>
</body>
</html>
