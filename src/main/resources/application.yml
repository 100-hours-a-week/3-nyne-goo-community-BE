server:
  address: 0.0.0.0   # 모든 IP에서 접근 허용
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/community?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root3038
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # 개발 중에는 create / create-drop / update 중 선택
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  thymeleaf:
    enabled: true
    prefix: classpath:/templates/
    suffix: .html
    cache: false

logging:
  level:
    org.hibernate.SQL: debug
    org.springframework.web: DEBUG
    org.springframework.transaction: DEBUG

jwt:
  secret: "secret_key_should_be_very_long_value_1234512345_secret_key_should_be_very_long_value_1234512345_secret_key_should_be_very_long_value_1234512345"