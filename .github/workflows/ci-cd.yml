name: ci-cd.yml
on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test-and-build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradle 환경 설치
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      # 권한 변경
      - name: Run chmod to make gradlew executable
        run: chmod +x ./gradlew

      # build
      - name: Build with Gradle Wrapper
        run: ./gradlew build

  deploy:
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.event_name == 'push'  # push 일 때만 deploy

    env:
      AWS_REGION: ap-northeast-2
      ECR_REPOSITORY: dorandoran-be
      CODEDEPLOY_APPLICATION_NAME: dorandoranCD-app
      CODEDEPLOY_DEPLOYMENT_GROUP: dorandoran-CD-group
      S3_BUCKET: dorandoran-s3-bucket

    steps:
      - uses: actions/checkout@v4
      # AWS  자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ECR 로그인
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # build and push
      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: latest
        run: |
          echo "ECR_REGISTRY=$ECR_REGISTRY"
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # create zip (appspec.yml, scripts/)
      - name: Zip CodeDeploy bundle
        run: |
          zip -r deploy.zip appspec.yml scripts/ docker-compose.yml

      # S3에 업로드
      - name: Upload bundle to S3
        run: |
          aws s3 cp deploy.zip s3://$S3_BUCKET/backend/deploy-${GITHUB_SHA}.zip

      # CodeDeploy 배포 생성
      - name: Create CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name $CODEDEPLOY_APPLICATION_NAME \
            --deployment-group-name $CODEDEPLOY_DEPLOYMENT_GROUP \
            --s3-location bucket=$S3_BUCKET,key=backend/deploy-${GITHUB_SHA}.zip,bundleType=zip \
            --region $AWS_REGION